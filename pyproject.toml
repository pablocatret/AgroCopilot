[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrocopilot"
version = "0.1.0"
description = "Multi-agent agricultural copilot with opt-in memory, traceability and React UI"
authors = [{ name = "Pablo Catret-Ruber", email = "pablo.catret@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.54.0",
  "fastapi>=0.112.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.5.2",
  "tenacity>=8.2.2",
  "sqlalchemy>=2.0.30",
  "psycopg2-binary>=2.9.9",
  "pgvector>=0.2.5",
  "httpx>=0.27.0",
  "trafilatura>=1.9.0",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.9.2",
  "diskcache>=5.6.3",
  "pandas>=2.2.2",
  "pillow>=10.3.0",
  "opencv-python>=4.9.0.80",
  "jinja2>=3.1.4",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "loguru>=0.7.2",
  "sse-starlette>=2.1.0",
  "httpx-sse>=0.4.0",
  "rapidfuzz>=3.9.0",
  "python-dateutil>=2.9.0.post0",
  "python-multipart>=0.0.20",
  "unstructured[pdf]>=0.14.5",
  "pypdf>=4.3.1",
  "tiktoken>=0.7.0",
  "pymupdf>=1.24.2",
  "pytesseract>=0.3.13",
  "planetary-computer>=0.5.1",
  "pystac-client>=0.7.6",
  "rio-tiler>=7.0.0",
  "streamlit>=1.37.0",
  "filelock>=3.15.0",

]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.6",
  "pytest-httpx>=0.36.0",
  "respx>=0.21.1",
  "ruff>=0.4.8",
  "black>=24.4.2",
  "matplotlib>=3.9.0",
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mutmut]
paths_to_mutate = [
  "evaluation",
]
tests_dir = [
  "tests_evaluation/",
]
also_copy = [
  "evaluation/",
  "evaluation/cases/",
  "tests_evaluation/",
]
mutate_only_covered_lines = true
debug = true
pytest_add_cli_args = [
  "-q",
]
